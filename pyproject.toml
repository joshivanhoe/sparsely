[tool.poetry]
name = "sparsely"
version = "1.1.2"
description = "Scalable sparse linear models in Python"
license ="MIT"
authors = [
    "Joshua Ivanhoe <joshua.k.ivanhoe@gmail.com>"
]
readme = "README.md"
repository = "https://github.com/joshivanhoe/sparsely"
documentation = "https://joshivanhoe.github.io/sparsely/"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
packages = [
    { include = "sparsely", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
halfspace-optimizer = ">=0.1.0"
scikit-learn = ">=1.3.2"
tqdm = ">=4.66.1"

[tool.poetry.group.dev.dependencies]
black = "*"
flake8 = "*"
pre-commit = "*"
tomli = "*"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"

[tool.poetry.group.docs]
optional = true
[tool.poetry.group.docs.dependencies]
sphinx = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
